<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1a2e"/>
      <stop offset="1" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="bird" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00ff88"/>
      <stop offset="1" stop-color="#3d9dff"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00cc6e"/>
      <stop offset="1" stop-color="#2b7fd6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.42" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#00ff88" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- chirp sound waves -->
  <g fill="none" stroke="url(#bird)" stroke-linecap="round" opacity="0.9">
    <path d="M 353 148 a 34 34 0 0 1 0 48"  stroke-width="17"/>
    <path d="M 384 117 a 78 78 0 0 1 0 110" stroke-width="17" opacity="0.65"/>
    <path d="M 415 86  a 122 122 0 0 1 0 172" stroke-width="17" opacity="0.38"/>
  </g>

  <!-- bird -->
  <g>
    <!-- tail -->
    <path d="M 118 372 L 40 430 L 150 416 Z" fill="url(#wing)"/>
    <!-- body + head -->
    <path d="M 108 380
             C 96 322, 118 258, 176 226
             C 196 154, 288 140, 322 196
             L 352 208
             L 318 232
             C 322 320, 258 402, 162 402
             C 140 402, 120 394, 108 380 Z"
          fill="url(#bird)"/>
    <!-- wing -->
    <path d="M 172 268
             C 226 250, 282 264, 300 300
             C 262 310, 240 344, 200 354
             C 168 340, 158 300, 172 268 Z"
          fill="url(#wing)" opacity="0.85"/>
    <!-- eye -->
    <circle cx="284" cy="196" r="15" fill="#071018"/>
    <circle cx="290" cy="190" r="5" fill="#e6fff3"/>
  </g>
</svg>
