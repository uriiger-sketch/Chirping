<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Chirping — Bird Sound Classifier</title>
<meta name="description" content="Record bird sounds and get instant identification with 3D spectrogram visualization — no API key needed">
<meta name="theme-color" content="#070b14">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#070b14;--bg2:#0d1525;--bg3:#111d30;
  --green:#00ff88;--blue:#3d9dff;--purple:#a855f7;--red:#ff4466;
  --text:#e2e8f0;--muted:#64748b;
  --card:rgba(255,255,255,0.04);--border:rgba(255,255,255,0.08);
  --radius:16px;--font:'Inter',sans-serif;--mono:'JetBrains Mono',monospace;
}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);overflow-x:hidden}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
header{
  padding:.9rem 1.25rem;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);
  background:rgba(7,11,20,.9);backdrop-filter:blur(12px);
  position:sticky;top:0;z-index:50;flex-shrink:0;
}
.logo{display:flex;align-items:center;gap:.6rem}
.logo-icon{
  width:36px;height:36px;border-radius:9px;
  background:linear-gradient(135deg,var(--green),var(--blue));
  display:flex;align-items:center;justify-content:center;font-size:1.1rem;
  animation:pulse-logo 3s ease-in-out infinite;
}
@keyframes pulse-logo{0%,100%{box-shadow:0 0 0 0 rgba(0,255,136,.3)}50%{box-shadow:0 0 0 7px transparent}}
.logo-text{font-size:1.1rem;font-weight:700}
.logo-sub{font-size:.62rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.geo-badge{
  display:flex;align-items:center;gap:.35rem;
  padding:.3rem .65rem;border-radius:999px;
  background:var(--card);border:1px solid var(--border);
  font-size:.72rem;color:var(--muted);max-width:160px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.geo-dot{width:6px;height:6px;border-radius:50%;background:var(--muted);flex-shrink:0;transition:background .3s}
.geo-dot.on{background:var(--green);box-shadow:0 0 6px var(--green)}
.canvas-wrap{position:relative;flex:1;min-height:0;overflow:hidden}
#c{display:block;width:100%;height:100%;touch-action:none}
.canvas-hints{
  position:absolute;bottom:.75rem;left:50%;transform:translateX(-50%);
  display:flex;gap:.5rem;pointer-events:none;
}
.chip{
  padding:.25rem .6rem;border-radius:999px;
  background:rgba(7,11,20,.75);border:1px solid var(--border);
  font-size:.68rem;color:var(--muted);backdrop-filter:blur(8px);white-space:nowrap;
}
.controls{
  padding:1rem 1.25rem 1.25rem;
  background:var(--bg2);border-top:1px solid var(--border);
  flex-shrink:0;display:flex;flex-direction:column;gap:.9rem;
}
.record-row{display:flex;align-items:center;gap:1rem}
#recBtn{
  width:70px;height:70px;border-radius:50%;border:none;cursor:pointer;flex-shrink:0;
  background:linear-gradient(135deg,var(--green),var(--blue));
  display:flex;align-items:center;justify-content:center;font-size:1.6rem;
  transition:transform .15s;touch-action:manipulation;
}
#recBtn:active{transform:scale(.93)}
#recBtn.rec{
  background:linear-gradient(135deg,var(--red),#ff8800);
  animation:pulse-rec 1.2s ease-in-out infinite;
}
@keyframes pulse-rec{
  0%{box-shadow:0 0 0 0 rgba(255,68,102,.5)}
  70%{box-shadow:0 0 0 16px transparent}
  100%{box-shadow:0 0 0 0 transparent}
}
.rec-info{flex:1;display:flex;flex-direction:column;gap:.4rem}
#statusMsg{font-size:.88rem;font-weight:500;color:var(--muted)}
.meter-wrap{height:5px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
.meter-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--green),var(--blue));border-radius:3px;transition:width .05s}
#timer{font-family:var(--mono);font-size:.95rem;color:var(--green);display:none}
.filter-row{display:flex;gap:.5rem;flex-wrap:wrap}
.ftoggle{
  display:flex;align-items:center;gap:.35rem;
  padding:.3rem .65rem;border-radius:999px;
  background:var(--card);border:1px solid var(--border);
  cursor:pointer;font-size:.72rem;user-select:none;
  transition:border-color .2s,background .2s;touch-action:manipulation;
}
.ftoggle.on{border-color:rgba(0,255,136,.4);background:rgba(0,255,136,.08);color:var(--green)}
.ftoggle-dot{width:6px;height:6px;border-radius:50%;background:var(--muted);transition:background .2s}
.ftoggle.on .ftoggle-dot{background:var(--green)}
.feats{display:flex;gap:.75rem;flex-wrap:wrap;font-family:var(--mono);font-size:.7rem;color:var(--muted)}
.feat span{color:var(--blue)}
#loading{
  position:fixed;inset:0;z-index:200;
  background:rgba(7,11,20,.88);backdrop-filter:blur(6px);
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:1rem;
}
#loading.show{display:flex}
.spinner{
  width:48px;height:48px;border-radius:50%;
  border:3px solid rgba(0,255,136,.15);border-top-color:var(--green);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
#loadStep{font-size:.8rem;color:var(--green);font-family:var(--mono)}
#results{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:linear-gradient(180deg,transparent 0%,rgba(7,11,20,.98) 12%);
  transform:translateY(100%);
  transition:transform .48s cubic-bezier(.16,1,.3,1);
  max-height:80vh;overflow-y:auto;padding:2.5rem 1.25rem 1.5rem;
}
#results.show{transform:translateY(0)}
.res-hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:.9rem}
.res-title{font-size:.95rem;font-weight:600}
.res-meta{font-size:.7rem;color:var(--muted);font-family:var(--mono);margin-top:.15rem}
.res-note{font-size:.68rem;color:var(--muted);line-height:1.45;padding:.1rem .25rem .3rem}
.btn-close{
  background:var(--card);border:1px solid var(--border);
  border-radius:8px;padding:.3rem .55rem;
  color:var(--muted);cursor:pointer;font-size:.8rem;flex-shrink:0;margin-left:.5rem;
}
.cards{display:flex;flex-direction:column;gap:.75rem}
.bcard{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:.9rem;position:relative;
  overflow:hidden;cursor:pointer;
  opacity:0;animation:sup .4s forwards;
}
.bcard:nth-child(1){animation-delay:0ms}
.bcard:nth-child(2){animation-delay:110ms}
.bcard:nth-child(3){animation-delay:220ms}
@keyframes sup{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.bcard:hover{border-color:rgba(0,255,136,.25)}
.bcard-inner{display:flex;gap:.85rem;align-items:flex-start}
.bcard-img{width:82px;height:82px;border-radius:10px;object-fit:cover;background:var(--bg3);flex-shrink:0}
.bcard-body{flex:1;min-width:0}
.bcard-rank{
  position:absolute;top:.6rem;right:.6rem;
  width:22px;height:22px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:700;
}
.rank-1{background:linear-gradient(135deg,#ffd700,#ff8800);color:#111}
.rank-2{background:linear-gradient(135deg,#c0c0c0,#888);color:#111}
.rank-3{background:linear-gradient(135deg,#cd7f32,#8b4513);color:#fff}
.bcard-common{font-size:.92rem;font-weight:600;margin-bottom:.15rem}
.bcard-sci{font-size:.72rem;color:var(--muted);font-style:italic;margin-bottom:.45rem}
.conf-row{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted);margin-bottom:.25rem}
.conf-pct{font-family:var(--mono);font-weight:600}
.conf-bar{height:4px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;margin-bottom:.5rem}
.conf-fill{height:100%;border-radius:2px;width:0%;transition:width 1s cubic-bezier(.16,1,.3,1)}
.hi{background:linear-gradient(90deg,var(--green),#00cc66)}
.md{background:linear-gradient(90deg,var(--blue),#0066cc)}
.lo{background:linear-gradient(90deg,var(--purple),#6600cc)}
.rgn-badge{
  display:inline-flex;align-items:center;gap:.3rem;
  padding:.18rem .55rem;border-radius:999px;font-size:.66rem;font-weight:500;
}
.rgn-ok{background:rgba(0,255,136,.1);color:var(--green);border:1px solid rgba(0,255,136,.2)}
.rgn-typ{background:rgba(61,157,255,.1);color:var(--blue);border:1px solid rgba(61,157,255,.2)}
.rgn-no{background:rgba(168,85,247,.1);color:var(--purple);border:1px solid rgba(168,85,247,.2)}
.freq-tag{font-size:.68rem;color:var(--blue);font-family:var(--mono);margin-top:.3rem}
.bcard-detail{
  font-size:.74rem;color:var(--muted);line-height:1.55;
  display:none;margin-top:.6rem;padding-top:.6rem;border-top:1px solid var(--border);
}
.bcard-detail.open{display:block}
.bcard-detail p{margin-bottom:.3rem}
.bcard-detail strong{color:var(--text)}
.xeno-link{
  display:inline-flex;align-items:center;gap:.3rem;
  color:var(--blue);font-size:.72rem;text-decoration:none;margin-top:.4rem;
}
.xeno-link:hover{text-decoration:underline}
.audio-row{margin-top:.5rem}
.audio-label{font-size:.7rem;color:var(--muted);display:block}
audio{border-radius:6px;outline:none;accent-color:var(--green);display:block}
#toast{
  position:fixed;bottom:1.5rem;left:50%;
  transform:translateX(-50%) translateY(80px);
  background:#ff4444;color:#fff;
  padding:.65rem 1.1rem;border-radius:10px;font-size:.82rem;z-index:500;
  transition:transform .3s;pointer-events:none;
  max-width:calc(100vw - 2rem);text-align:center;
}
#toast.show{transform:translateX(-50%) translateY(0)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
:focus-visible{outline:2px solid var(--green);outline-offset:3px}
@media(min-width:700px){
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
  .controls{padding:1rem 2rem 1.5rem}
  header{padding:1rem 2rem}
}
</style>
</head>
<body>

<div id="app">
  <header role="banner">
    <div class="logo">
      <img class="logo-icon" src="icon.svg" alt="" aria-hidden="true">
      <div>
        <div class="logo-text">Chirping</div>
        <div class="logo-sub">Calibrated Bioacoustics &middot; Free &middot; v4.0</div>
      </div>
    </div>
    <div class="geo-badge" aria-live="polite" aria-label="Location">
      <div class="geo-dot" id="geoDot" aria-hidden="true"></div>
      <span id="geoText">Locating&hellip;</span>
    </div>
  </header>

  <div class="canvas-wrap" aria-hidden="true">
    <canvas id="c"></canvas>
    <div class="canvas-hints">
      <span class="chip">Drag to orbit</span>
      <span class="chip">Pinch to zoom</span>
    </div>
  </div>

  <div class="controls">
    <div class="record-row">
      <button id="recBtn" aria-label="Start recording" aria-pressed="false" onclick="toggleRec()">
        <span id="recIcon" aria-hidden="true">&#x1F399;&#xFE0F;</span>
      </button>
      <div class="rec-info">
        <div id="statusMsg" role="status" aria-live="polite">Tap to record a bird sound</div>
        <div class="meter-wrap" aria-hidden="true"><div class="meter-bar" id="mBar"></div></div>
        <div id="timer" aria-live="off">00:00</div>
      </div>
    </div>

    <div class="filter-row" role="group" aria-label="Display filters (identification always uses the raw, unfiltered signal)"
         title="These shape the live picture only — identification always measures the raw, unfiltered microphone signal.">
      <div class="ftoggle on" id="fHP" role="checkbox" aria-checked="true" tabindex="0"
           onclick="toggleFilter(this)" onkeydown="kbToggle(event,this)">
        <div class="ftoggle-dot"></div><span>View: hi-pass 300 Hz</span>
      </div>
      <div class="ftoggle on" id="fLP" role="checkbox" aria-checked="true" tabindex="0"
           onclick="toggleFilter(this)" onkeydown="kbToggle(event,this)">
        <div class="ftoggle-dot"></div><span>View: lo-pass 12 kHz</span>
      </div>
      <div class="ftoggle on" id="fComp" role="checkbox" aria-checked="true" tabindex="0"
           onclick="toggleFilter(this)" onkeydown="kbToggle(event,this)">
        <div class="ftoggle-dot"></div><span>View: compressor</span>
      </div>
    </div>

    <div class="feats" aria-live="polite" aria-label="Detected audio features">
      <div class="feat" title="Peak of the noise-subtracted spectrum, interpolated to ≲1 Hz">Peak: <span id="fPeak">&mdash;</span></div>
      <div class="feat" title="5 %–95 % energy band of the call">Band: <span id="fBand">&mdash;</span></div>
      <div class="feat" title="In-band signal-to-noise ratio, 150 Hz–12 kHz">SNR: <span id="fSnr">&mdash;</span></div>
      <div class="feat" title="Spectral concentration: whistle ≈ 100 %, screech or buzz ≪ 50 %">Tone: <span id="fTone">&mdash;</span></div>
      <div class="feat" title="Repetition rate of notes from the envelope autocorrelation">Rate: <span id="fRate">&mdash;</span></div>
    </div>
  </div>
</div>

<div id="loading" role="status" aria-live="assertive">
  <div class="spinner" aria-hidden="true"></div>
  <div style="font-size:.9rem;color:var(--muted)">Identifying bird species&hellip;</div>
  <div id="loadStep">Analysing audio&hellip;</div>
</div>

<div id="results" aria-live="polite" aria-label="Identification results">
  <div class="res-hdr">
    <div>
      <div class="res-title" id="resTitle">Top 3 Matches</div>
      <div class="res-meta" id="resMeta"></div>
    </div>
    <button class="btn-close" id="closeBtn" aria-label="Close results">&#x2715;</button>
  </div>
  <div class="cards" id="cards" role="list"></div>
</div>

<div id="toast" role="alert" aria-live="assertive"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.min.js"></script>
<script>
"use strict";

// ── Bird species database ─────────────────────────────────────────────────────
// n=name, s=sci, fmin/fmax/fdom Hz (primary advertising vocalization: band limits and peak-energy
// frequency), r=regions, t=vocal type (w whistle, h harmonic stack, n noisy/buzzy, t trill,
// c complex warble, p percussive), nr=[lo,hi] notes per second (null = single sustained note),
// c/cf = confidence (h/m/l) in t+nr / in the frequencies, sy=synonyms for occurrence look-ups,
// h=habitat, f=fun fact, w=wiki slug. Curated by an expert-panel pass in v4 (provenance and
// per-entry rationale: docs/bird-db-provenance.json). Rules: .claude/skills/bird-acoustic-data.
const BIRD_DB = [
  // North America
  {n:"American Robin",s:"Turdus migratorius",fmin:2000,fmax:5000,fdom:2800,r:["na"],t:"w",nr:[2,4],c:"h",cf:"h",
   h:"Open woodlands, parks, and suburban lawns across North America.",
   f:"Males begin singing in pre-dawn darkness — among the first to start the dawn chorus.",w:"American_robin"},
  {n:"Northern Cardinal",s:"Cardinalis cardinalis",fmin:1500,fmax:6500,fdom:3800,r:["na"],t:"w",nr:[2,8],c:"m",cf:"m",
   h:"Forest edges, thickets, gardens, and suburban yards in eastern North America.",
   f:"Unlike most female songbirds, female cardinals also sing — sometimes from inside the nest.",w:"Northern_cardinal"},
  {n:"Mourning Dove",s:"Zenaida macroura",fmin:300,fmax:900,fdom:450,r:["na"],t:"w",nr:[1,2],c:"h",cf:"m",
   h:"Open fields, roadsides, and suburban areas; one of the most abundant birds in North America.",
   f:"Can fly at up to 88 km/h — the wing whistle on take-off is produced by its primary feathers.",w:"Mourning_dove"},
  {n:"Black-capped Chickadee",s:"Poecile atricapillus",fmin:2900,fmax:4600,fdom:3700,r:["na"],t:"w",nr:[1.5,2.5],c:"h",cf:"h",sy:["Parus atricapillus"],
   h:"Mixed and deciduous forests, parks, and suburban areas across northern North America.",
   f:"Their chick-a-dee call encodes threat information — more 'dee' notes means more danger.",w:"Black-capped_chickadee"},
  {n:"American Crow",s:"Corvus brachyrhynchos",fmin:400,fmax:3000,fdom:1400,r:["na"],t:"h",nr:[1.5,3],c:"m",cf:"m",
   h:"Nearly every terrestrial habitat in North America from forests to cities.",
   f:"Crows hold 'funerals' — gathering around dead crows — apparently to learn about dangers.",w:"American_crow"},
  {n:"Blue Jay",s:"Cyanocitta cristata",fmin:600,fmax:5500,fdom:2800,r:["na"],t:"n",nr:[2,4],c:"m",cf:"m",
   h:"Forest edges, oak woodlands, parks, and suburbs in eastern North America.",
   f:"Can mimic the calls of hawks so accurately that other birds take cover.",w:"Blue_jay"},
  {n:"Song Sparrow",s:"Melospiza melodia",fmin:1200,fmax:7500,fdom:3800,r:["na"],t:"c",nr:[4,15],c:"m",cf:"m",
   h:"Dense shrubs near water, marshes, and weedy fields across North America.",
   f:"Each male has a unique song repertoire of up to 20 different song types.",w:"Song_sparrow"},
  {n:"House Wren",s:"Troglodytes aedon",fmin:2000,fmax:8500,fdom:4500,r:["na","sa"],t:"t",nr:[10,20],c:"m",cf:"m",sy:["Troglodytes musculus"],
   h:"Dense shrubby vegetation near forest edges, gardens, and parks across the Americas.",
   f:"Despite its tiny size, it fiercely defends territory and will destroy other birds' eggs.",w:"House_wren"},
  {n:"Wood Thrush",s:"Hylocichla mustelina",fmin:1000,fmax:6000,fdom:3200,r:["na"],t:"w",nr:[4,10],c:"h",cf:"m",
   h:"Interior of deciduous forests in eastern North America.",
   f:"Produces two notes simultaneously using both sides of its syrinx, creating its flute-like song.",w:"Wood_thrush"},
  {n:"Barred Owl",s:"Strix varia",fmin:200,fmax:1200,fdom:550,r:["na"],t:"w",nr:[2,4],c:"m",cf:"m",
   h:"Dense forests near water, swamps, and wooded suburbs of eastern North America.",
   f:"Its call sounds like 'Who cooks for you? Who cooks for you-all?' — a classic forest sound.",w:"Barred_owl"},
  {n:"Common Loon",s:"Gavia immer",fmin:600,fmax:3000,fdom:1600,r:["na","eu"],t:"h",nr:[2,5],c:"m",cf:"m",
   h:"Clear northern lakes for breeding; open ocean coastlines in winter.",
   f:"Its haunting yodel travels over 10 km and is used only by males to advertise territory.",w:"Common_loon"},
  {n:"Killdeer",s:"Charadrius vociferus",fmin:1000,fmax:5000,fdom:2400,r:["na","sa"],t:"w",nr:[2,5],c:"m",cf:"l",
   h:"Open ground: gravel, lawns, mudflats, and fields across North and Central America.",
   f:"Performs a convincing broken-wing display to lure predators away from its ground nest.",w:"Killdeer"},
  {n:"Baltimore Oriole",s:"Icterus galbula",fmin:1200,fmax:5500,fdom:2800,r:["na","sa"],t:"w",nr:[3,6],c:"h",cf:"m",
   h:"Deciduous forest canopy and suburban trees in eastern North America.",
   f:"Builds one of the most elaborate nests in North America — a hanging woven pouch.",w:"Baltimore_oriole"},
  {n:"American Goldfinch",s:"Spinus tristis",fmin:1500,fmax:8000,fdom:4200,r:["na"],t:"c",nr:[5,12],c:"m",cf:"m",sy:["Carduelis tristis"],
   h:"Open fields, weedy meadows, and gardens with thistles and sunflowers.",
   f:"Delays nesting until mid-summer to coincide with peak thistle-seed availability.",w:"American_goldfinch"},
  {n:"Eastern Bluebird",s:"Sialia sialis",fmin:1500,fmax:5000,fdom:3000,r:["na"],t:"w",nr:[2,5],c:"m",cf:"m",
   h:"Open woodlands, fields with scattered trees, and forest edges in eastern North America.",
   f:"Bluebirds can spot a caterpillar on the ground from 30 metres away.",w:"Eastern_bluebird"},
  {n:"Red-tailed Hawk",s:"Buteo jamaicensis",fmin:1000,fmax:5000,fdom:2400,r:["na"],t:"n",nr:null,c:"h",cf:"l",
   h:"Open to semi-open areas including deserts, grasslands, and roadsides across North America.",
   f:"The scream used for every Hollywood eagle scene is actually a Red-tailed Hawk call.",w:"Red-tailed_hawk"},
  {n:"Downy Woodpecker",s:"Dryobates pubescens",fmin:800,fmax:5000,fdom:2200,r:["na"],t:"p",nr:[14,18],c:"h",cf:"l",sy:["Picoides pubescens"],
   h:"Deciduous forests, orchards, parks, and suburban areas across North America.",
   f:"Its skull has spongy shock-absorbing bone; the bill hammers up to 20 times per second.",w:"Downy_woodpecker"},
  {n:"White-throated Sparrow",s:"Zonotrichia albicollis",fmin:2500,fmax:5200,fdom:3900,r:["na"],t:"w",nr:[2,8],c:"h",cf:"m",
   h:"Boreal forests in summer; thickets and shrubs in eastern North America in winter.",
   f:"Its 'Oh sweet Canada Canada Canada' song is recognised across the continent.",w:"White-throated_sparrow"},
  {n:"Great Blue Heron",s:"Ardea herodias",fmin:200,fmax:1500,fdom:600,r:["na","sa"],t:"n",nr:null,c:"m",cf:"l",
   h:"Wetlands, marshes, lake shores, and rivers across North and Central America.",
   f:"Stands motionless for hours then strikes with lightning speed, stabbing fish with its bill.",w:"Great_blue_heron"},
  {n:"Ruby-throated Hummingbird",s:"Archilochus colubris",fmin:2000,fmax:8000,fdom:4000,r:["na"],t:"n",nr:[3,10],c:"l",cf:"l",
   h:"Open woodland, forest edges, meadows, and gardens in eastern North America.",

  lat:40.7, lon:-74.0, geoReady:false,
  audioCtx:null, stream:null, analyser:null, hzPerBin:125, fs:48000, bwHz:null,
  srcNode:null, displayIn:null, hp:null, lp:null, comp:null,
  tap:null, analyzer:null, nSamples:0, recId:0, gotSignal:false, recStart:0, occP:null,
  timerInt:null, isRec:false,
  hpOn:true, lpOn:true, compOn:true,
};

// ── Geolocation ───────────────────────────────────────────────────────────────
(function initGeo() {
  if (!navigator.geolocation) { geoText.textContent="No geolocation"; return; }
  navigator.geolocation.getCurrentPosition(
    pos => {
      S.lat=pos.coords.latitude; S.lon=pos.coords.longitude; S.geoReady=true;
      geoDot.classList.add("on");
      fetch(`https://nominatim.openstreetmap.org/reverse?lat=${S.lat}&lon=${S.lon}&format=json`)
        .then(r=>r.json()).then(d=>{
          const city=d.address?.city||d.address?.town||d.address?.state||"";
          const ctry=d.address?.country||"";
          geoText.textContent=(city?city+", ":"")+ctry||`${S.lat.toFixed(1)}, ${S.lon.toFixed(1)}`;
        }).catch(()=>{ geoText.textContent=`${S.lat.toFixed(1)}, ${S.lon.toFixed(1)}`; });
    },
    ()=>{ geoText.textContent="Location denied"; toast("Location denied — global species pool used."); },
    {timeout:8000}
  );
})();

// ── Filter toggles ────────────────────────────────────────────────────────────
function toggleFilter(el) {
  el.classList.toggle("on"); const on=el.classList.contains("on");
  el.setAttribute("aria-checked",on);
  if(el.id==="fHP") S.hpOn=on; if(el.id==="fLP") S.lpOn=on; if(el.id==="fComp") S.compOn=on;
  rebuildChain();
}
function kbToggle(e,el){if(e.key==="Enter"||e.key===" "){e.preventDefault();toggleFilter(el);}}

// ── Visualization: 3D spectrogram with graceful 2D fallback ──────────────────
// The audio capture loop below NEVER depends on Three.js — if the CDN or WebGL
// fails, recording and classification still work with a 2D canvas spectrogram.
const canvas=$("c");
const hist=Array.from({length:TIME_SLICES},()=>new Float32Array(FREQ_BINS));
let hIdx=0,viz=null,ctx2d=null;

function makeOrbit(cam,dom){
  // Minimal orbit control: drag to rotate, wheel/pinch to zoom, damped, auto-rotate.
  // (three.js removed examples/js OrbitControls in r148 — this replaces it.)
  const tgt=new THREE.Vector3(0,3,0);
  let az=0,pol=1.08,dist=31,tAz=az,tPol=pol,tDist=dist;
  let drag=false,px=0,py=0,pinchD=0;
  const clampPol=v=>Math.max(.15,Math.min(1.5,v));
  const clampDist=v=>Math.max(12,Math.min(70,v));
  dom.addEventListener("pointerdown",e=>{drag=true;px=e.clientX;py=e.clientY;api.autoRotate=false;});
  window.addEventListener("pointermove",e=>{
    if(!drag)return;
    tAz-=(e.clientX-px)*.0055;tPol=clampPol(tPol-(e.clientY-py)*.0055);
    px=e.clientX;py=e.clientY;
  });
  window.addEventListener("pointerup",()=>{drag=false;});
  dom.addEventListener("wheel",e=>{e.preventDefault();tDist=clampDist(tDist*(1+e.deltaY*.0012));},{passive:false});
  dom.addEventListener("touchstart",e=>{
    if(e.touches.length===2){drag=false;pinchD=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);}
  },{passive:true});
  dom.addEventListener("touchmove",e=>{
    if(e.touches.length===2&&pinchD>0){
      const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
      tDist=clampDist(tDist*pinchD/d);pinchD=d;
    }
  },{passive:true});
  const api={
    autoRotate:true,
    update(){
      if(api.autoRotate)tAz+=.0016;
      az+=(tAz-az)*.08;pol+=(tPol-pol)*.08;dist+=(tDist-dist)*.08;
      cam.position.set(
        tgt.x+dist*Math.sin(pol)*Math.sin(az),
        tgt.y+dist*Math.cos(pol),
        tgt.z+dist*Math.sin(pol)*Math.cos(az));
      cam.lookAt(tgt);
    }
  };
  return api;
}

function ampToColor(a,birdRange){
  const c=new THREE.Color();
  if(birdRange&&a>0.15){c.setHSL(0.37,1,0.12+a*0.52);}
  else{c.setHSL((1-a)*.55,0.8,.28+a*.4);}
  return c;
}

(function initViz(){
  try{
    if(typeof THREE==="undefined")throw new Error("three.js failed to load");
    const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
    renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
    const scene=new THREE.Scene();
    scene.background=new THREE.Color(0x070b14);
    scene.fog=new THREE.FogExp2(0x070b14,0.018);
    const camera=new THREE.PerspectiveCamera(55,1,0.1,500);
    camera.position.set(0,14,28);
    const oc=makeOrbit(camera,renderer.domElement);
    const geom=new THREE.PlaneGeometry(FREQ_BINS*0.45,TIME_SLICES*0.42,FREQ_BINS-1,TIME_SLICES-1);
    geom.rotateX(-Math.PI/2);
    geom.setAttribute("color",new THREE.BufferAttribute(new Float32Array(geom.attributes.position.count*3),3));
    scene.add(new THREE.Mesh(geom,new THREE.MeshBasicMaterial({vertexColors:true,wireframe:true})));
    scene.add(new THREE.GridHelper(80,24,0x0d1a2a,0x091220));
    const pN=400,pPos=new Float32Array(pN*3);
    for(let i=0;i<pN;i++){pPos[i*3]=(Math.random()-.5)*70;pPos[i*3+1]=Math.random()*20;pPos[i*3+2]=(Math.random()-.5)*50;}
    const pG=new THREE.BufferGeometry();pG.setAttribute("position",new THREE.BufferAttribute(pPos,3));
    scene.add(new THREE.Points(pG,new THREE.PointsMaterial({size:.22,color:0x00ff88,transparent:true,opacity:.3})));
    viz={renderer,scene,camera,oc,geom,pG,pN};
  }catch(e){
    console.warn("3D visualization unavailable — using 2D spectrogram:",e);
    try{ctx2d=canvas.getContext("2d");}catch(_){}
    document.querySelectorAll(".canvas-hints .chip").forEach((c,i)=>{
      if(i===0)c.textContent="2D spectrogram";else c.style.display="none";
    });
  }
})();

function updateMesh3D(row){
  const {geom}=viz;
  hist[hIdx%TIME_SLICES]=row;hIdx++;
  const pos=geom.attributes.position,col=geom.attributes.color;
  const H=S.hzPerBin||125;
  const BRD_LO_BIN=Math.floor(300/H),BRD_HI_BIN=Math.floor(8000/H);
  for(let t=0;t<TIME_SLICES;t++){
    const r=hist[(hIdx-TIME_SLICES+t+TIME_SLICES)%TIME_SLICES]||new Float32Array(FREQ_BINS);
    for(let f=0;f<FREQ_BINS;f++){const i=t*FREQ_BINS+f,a=r[f];pos.setY(i,a*9);const c=ampToColor(a,f>=BRD_LO_BIN&&f<=BRD_HI_BIN);col.setXYZ(i,c.r,c.g,c.b);}
  }
  pos.needsUpdate=true;col.needsUpdate=true;
}

function draw2D(row){
  const w=canvas.clientWidth,h=canvas.clientHeight;
  if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;ctx2d.fillStyle="#070b14";ctx2d.fillRect(0,0,w,h);}
  // Scroll left 2px, draw new column at right edge (bottom = low freq)
  ctx2d.drawImage(canvas,-2,0);
  ctx2d.fillStyle="#070b14";ctx2d.fillRect(w-2,0,2,h);
  const H=S.hzPerBin||125;
  const BRD_LO_BIN=Math.floor(300/H),BRD_HI_BIN=Math.floor(8000/H);
  for(let f=0;f<FREQ_BINS;f++){
    const a=row[f];if(a<=0.02)continue;
    const y=h-(f/FREQ_BINS)*h,bh=Math.max(1,h/FREQ_BINS);
    const bird=f>=BRD_LO_BIN&&f<=BRD_HI_BIN;
    ctx2d.fillStyle=bird&&a>0.15
      ?`hsl(140,100%,${Math.round(15+a*50)}%)`
      :`hsl(${Math.round((1-a)*200)},80%,${Math.round(25+a*40)}%)`;
    ctx2d.fillRect(w-2,y-bh,2,bh);
  }
}

function resizeRenderer(){
  if(!viz)return;
  const w=canvas.clientWidth,h=canvas.clientHeight;
  if(canvas.width!==w||canvas.height!==h){viz.renderer.setSize(w,h,false);viz.camera.aspect=w/h;viz.camera.updateProjectionMatrix();}
}

// ── Live display loop (always runs, viz-independent) ─────────────────────────
// The AnalyserNode feeds ONLY the picture and the level meter. Classification never reads it:
// it runs on raw PCM from the tap below (see captureTap), so display filters, the compressor and
// the screen's refresh rate cannot bias any measurement.
(function loop(){
  requestAnimationFrame(loop);
  const t=Date.now()/1000;
  let row;
  if(S.analyser&&S.isRec){
    const buf=new Uint8Array(S.analyser.frequencyBinCount);
    S.analyser.getByteFrequencyData(buf);
    // Max-pool each group of `step` FFT bins: a narrow whistle between picked bins stays visible.
    const step=Math.floor(buf.length/FREQ_BINS),sub=new Float32Array(FREQ_BINS);
    for(let i=0;i<FREQ_BINS;i++){let m=0;for(let j=i*step;j<(i+1)*step;j++)if(buf[j]>m)m=buf[j];sub[i]=m/255;}
    const BRD_LO=Math.floor(300/(S.hzPerBin||125)),BRD_HI=Math.floor(8000/(S.hzPerBin||125));
    let birdEnergy=0,totalEnergy=0;
    for(let i=0;i<FREQ_BINS;i++){totalEnergy+=sub[i];if(i>=BRD_LO&&i<=BRD_HI)birdEnergy+=sub[i];}
    const birdRatio=totalEnergy>0?birdEnergy/totalEnergy:0;
    mBar.style.width=Math.min(100,totalEnergy/FREQ_BINS*200)+"%";
    mBar.style.background=birdRatio>0.45
      ?"linear-gradient(90deg,var(--green),#00cc66)"
      :"linear-gradient(90deg,var(--muted),#334155)";
    row=sub;
  } else {
    const idle=new Float32Array(FREQ_BINS);
    for(let i=0;i<FREQ_BINS;i++)idle[i]=Math.max(0,Math.sin(t*.45+i*.12)*.07+.03);
    mBar.style.width="0%";mBar.style.background="linear-gradient(90deg,var(--green),var(--blue))";
    row=idle;
  }
  if(viz){
    resizeRenderer();
    updateMesh3D(row);
    const pp=viz.pG.attributes.position;
    for(let i=0;i<viz.pN;i++)pp.setY(i,pp.getY(i)+Math.sin(t+i)*.004);
    pp.needsUpdate=true;
    viz.oc.update();
    viz.renderer.render(viz.scene,viz.camera);
  }else if(ctx2d){
    draw2D(row);
  }
})();

// ── Raw PCM tap ───────────────────────────────────────────────────────────────
// AudioWorklet (inline module) with a ScriptProcessorNode fallback. It copies the linear,
// unprocessed microphone signal, mixes to mono and posts 4096-sample batches. The node feeds a
// zero-gain sink into destination so every engine keeps pulling it.
const TAP_WORKLET=`class ChirpingTap extends AudioWorkletProcessor{
  constructor(){super();this.b=new Float32Array(4096);this.n=0;this.live=true;
    this.port.onmessage=e=>{if(e.data==="flush"){if(this.n)this.port.postMessage(this.b.slice(0,this.n));this.n=0;this.live=false;this.port.postMessage("flushed");}};}
  process(inputs){
    if(!this.live)return false;
    const inp=inputs[0];if(!inp||!inp.length||!inp[0])return true;
    const L=inp[0].length,C=inp.length;
    for(let i=0;i<L;i++){let v=0;for(let c=0;c<C;c++)v+=inp[c][i];this.b[this.n++]=v/C;
      if(this.n===4096){this.port.postMessage(this.b,[this.b.buffer]);this.b=new Float32Array(4096);this.n=0;}}
    return true;}}
registerProcessor("chirping-tap",ChirpingTap);`;
async function captureTap(ctx,src,onChunk,forceScript){
  const sink=ctx.createGain();sink.gain.value=0;sink.connect(ctx.destination);
  if(!forceScript&&window.isSecureContext&&ctx.audioWorklet&&window.AudioWorkletNode){
    let url;
    try{
      url=URL.createObjectURL(new Blob([TAP_WORKLET],{type:"text/javascript"}));
      await Promise.race([ctx.audioWorklet.addModule(url),new Promise((_,no)=>setTimeout(()=>no(new Error("worklet load timeout")),3000))]);
      const node=new AudioWorkletNode(ctx,"chirping-tap",{numberOfInputs:1,numberOfOutputs:1,outputChannelCount:[1]});
      let flushed=null;
      node.port.onmessage=e=>{if(e.data==="flushed"){flushed&&flushed();return;}onChunk(e.data);};
      src.connect(node);node.connect(sink);
      return{kind:"worklet",
        flush:()=>new Promise(res=>{flushed=res;node.port.postMessage("flush");setTimeout(res,300);}),
        close(){try{src.disconnect(node);}catch(e){}try{node.disconnect();sink.disconnect();}catch(e){}}};
    }catch(e){console.warn("AudioWorklet unavailable — using ScriptProcessor:",e);}
    finally{if(url)URL.revokeObjectURL(url);}
  }
  const sp=ctx.createScriptProcessor(4096,1,1);
  sp.onaudioprocess=e=>onChunk(new Float32Array(e.inputBuffer.getChannelData(0)));
  src.connect(sp);sp.connect(sink);
  return{kind:"script",flush:()=>Promise.resolve(),
    close(){try{src.disconnect(sp);}catch(e){}try{sp.disconnect();sink.disconnect();}catch(e){}sp.onaudioprocess=null;}};
}

// ── Audio setup ───────────────────────────────────────────────────────────────
async function initAudio(){
  if(!navigator.mediaDevices?.getUserMedia)throw new Error("Microphone not supported.");
  // Close any previous context (important on iOS — stale contexts stay suspended)
  if(S.audioCtx){try{await S.audioCtx.close();}catch(e){}}
  S.stream=await navigator.mediaDevices.getUserMedia({
    audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false,channelCount:1},
    video:false
  });
  // Created AFTER getUserMedia and without a sampleRate option: iOS switches the hardware rate
  // when the mic opens, and Firefox rejects a MediaStreamSource whose rate differs from the context.
  S.audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  // iOS Safari requires explicit resume after user gesture
  if(S.audioCtx.state==="suspended"){
    try{await S.audioCtx.resume();}catch(e){}
  }
  S.audioCtx.onstatechange=()=>{if(S.isRec&&S.audioCtx&&S.audioCtx.state==="interrupted")stopRec();};
  S.fs=S.audioCtx.sampleRate;
  // A Bluetooth headset mic carries only 8–16 kHz audio inside a 48 kHz context: analyse only the
  // band it can actually deliver.
  const trackRate=S.stream.getAudioTracks()[0]?.getSettings?.().sampleRate;
  S.bwHz=trackRate&&trackRate<S.fs?0.45*trackRate:null;
  S.srcNode=S.audioCtx.createMediaStreamSource(S.stream);
  // Display branch: src → displayIn → [HP] → [LP] → [compressor] → analyser. The raw tap is a
  // separate, permanent branch from srcNode (rebuildChain never touches it).
  S.displayIn=S.audioCtx.createGain();S.srcNode.connect(S.displayIn);
  S.hp=S.audioCtx.createBiquadFilter();S.hp.type="highpass";S.hp.frequency.value=300;S.hp.Q.value=.7;
  S.lp=S.audioCtx.createBiquadFilter();S.lp.type="lowpass";S.lp.frequency.value=12000;S.lp.Q.value=.7;
  S.comp=S.audioCtx.createDynamicsCompressor();
  S.comp.threshold.value=-24;S.comp.knee.value=15;S.comp.ratio.value=4;S.comp.release.value=.1;
  S.analyser=S.audioCtx.createAnalyser();S.analyser.fftSize=4096;S.analyser.smoothingTimeConstant=.20;
  // Hz per displayed bin from the real device sample rate
  const _step=Math.floor(S.analyser.frequencyBinCount/FREQ_BINS);
  S.hzPerBin=_step*S.fs/S.analyser.fftSize; // e.g. 10*44100/4096=107.7 Hz
  rebuildChain();
}
function rebuildChain(){
  if(!S.displayIn)return;
  [S.displayIn,S.hp,S.lp,S.comp].forEach(n=>{try{n.disconnect();}catch(e){}});
  let cur=S.displayIn;
  if(S.hpOn){cur.connect(S.hp);cur=S.hp;}
  if(S.lpOn){cur.connect(S.lp);cur=S.lp;}
  if(S.compOn){cur.connect(S.comp);cur=S.comp;}
  cur.connect(S.analyser);
}

// ── Record toggle ─────────────────────────────────────────────────────────────
async function toggleRec(){
  if(S.isRec){stopRec();return;}
  if(S._starting)return; // guard against double-tap during async init
  S._starting=true;
  try{await initAudio();}catch(e){toast("Mic error: "+e.message);S._starting=false;return;}
  const id=++S.recId;
  S.analyzer=createAnalyzer(S.fs,{bwHz:S.bwHz});S.nSamples=0;S.gotSignal=false;S._analyzed=false;
  const onChunk=chunk=>{
    if(id!==S.recId)return; // late batch from a previous recording
    if(!S.gotSignal)for(let i=0;i<chunk.length;i+=64)if(chunk[i]!==0){S.gotSignal=true;break;}
    S.analyzer.push(chunk);S.nSamples+=chunk.length;
    if(S.isRec&&S.nSamples>=MAX_REC_SEC*S.fs)stopRec();
  };
  try{S.tap=await captureTap(S.audioCtx,S.srcNode,onChunk);S.tapKind=S.tap.kind;}
  catch(e){toast("Audio capture error: "+e.message);S._starting=false;return;}
  S._starting=false;
  // Health check: a worklet that delivers nothing (seen on some WebViews) is swapped for the
  // ScriptProcessor path before the user loses the recording.
  setTimeout(async()=>{
    if(id===S.recId&&S.isRec&&!S.gotSignal&&S.tap.kind==="worklet"){
      S.tap.close();S.tap=await captureTap(S.audioCtx,S.srcNode,onChunk,true);S.tapKind=S.tap.kind;
    }
  },750);
  // Prefetch the local, seasonal occurrence prior while the user records.
  S.occP=S.geoReady?fetchOccurrence(S.lat,S.lon):Promise.resolve(null);
  S.isRec=true;S.recStart=performance.now();
  recBtn.classList.add("rec");recIcon.textContent="⏹";
  recBtn.setAttribute("aria-label","Stop recording");recBtn.setAttribute("aria-pressed","true");
  statusMsg.textContent="Recording… tap ⏹ when the bird finishes";
  if(viz)viz.oc.autoRotate=false;
  timerEl.style.display="block";timerEl.textContent="00:00";
  S.timerInt=setInterval(()=>{timerEl.textContent=fmt(Math.floor(S.nSamples/S.fs));},250);
}
async function stopRec(){
  if(!S.isRec)return;
  S.isRec=false;
  clearInterval(S.timerInt);timerEl.style.display="none";
  recBtn.classList.remove("rec");recIcon.textContent="🎙️";
  recBtn.setAttribute("aria-label","Start recording");recBtn.setAttribute("aria-pressed","false");
  statusMsg.textContent="Analysing…";
  if(viz)viz.oc.autoRotate=true;
  // Drain the tap's last partial batch, THEN release the mic and the audio context (an open
  // context keeps iOS in record mode and drains the battery).
  try{await S.tap?.flush();}catch(e){}
  S.recId++;                                 // anything arriving later is dropped
  S.tap?.close();S.tap=null;
  S.stream?.getTracks().forEach(t=>t.stop());
  const elapsed=(performance.now()-S.recStart)/1000,expect=elapsed*S.fs;
  if(S.nSamples>S.fs&&Math.abs(S.nSamples/expect-1)>0.02)
    console.warn(`Capture clock drift: ${S.nSamples} samples in ${elapsed.toFixed(2)} s at ${S.fs} Hz`);
  try{await S.audioCtx?.close();}catch(e){}S.audioCtx=null;S.analyser=null;S.displayIn=null;S.srcNode=null;
  onStop();
}
document.addEventListener("visibilitychange",()=>{if(document.hidden&&S.isRec)stopRec();});
function fmt(s){return`${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;}

// ── Calibrated bioacoustic DSP ────────────────────────────────────────────────
// Everything here works on LINEAR PCM and LINEAR POWER; dB appears only for display and for
// log-parabolic peak interpolation. See .claude/skills/bioacoustic-dsp for the physics behind
// each choice and the tolerances verified by tests/dsp-precision.mjs.
const DSP={fLo:150,fHi:12000,trimSec:0.2,hpHz:100,winSec:0.0213,
  q:0.2,           // noise PSD = per-bin 20th percentile of 3-frame-smoothed power…
  qBias:0.417,        // …divided by this calibrated quantile/mean ratio (set below) → unbiased mean noise power
  onDb:9,offDb:5,  // activity hysteresis on 3×3-smoothed per-cell SNR (0.0 % false activity on white noise)
  cellDb:6,        // a time–frequency cell counts as "signal" for measurements above this SNR
  minNoteSec:0.015,maxGapSec:0.020,peakFloorDb:-20,maxPeaks:5,concBins:3,
  deadPow:1e-14};   // per-bin power treated as digital silence / absolute noise floor (≈ −116 dBFS in-band)

// Real-input radix-2 FFT (N/2-point complex FFT + split step). Returns fn(x, outPower, k0, k1)
// writing |X_k|² for k0≤k≤k1. Tables are cached per N.
const _fftCache={};
function makeRealFFT(N){
  if(_fftCache[N])return _fftCache[N];
  const M=N>>1,bits=Math.log2(M),rev=new Uint32Array(M);
  for(let i=0;i<M;i++){let r=0;for(let b=0;b<bits;b++)r|=((i>>b)&1)<<(bits-1-b);rev[i]=r;}
  const cs=new Float64Array(M>>1),sn=new Float64Array(M>>1);
  for(let j=0;j<M>>1;j++){cs[j]=Math.cos(2*Math.PI*j/M);sn[j]=Math.sin(2*Math.PI*j/M);}
  const wr=new Float64Array(M),wi=new Float64Array(M);
  for(let k=0;k<M;k++){wr[k]=Math.cos(2*Math.PI*k/N);wi[k]=Math.sin(2*Math.PI*k/N);}
  const re=new Float64Array(M),im=new Float64Array(M);
  const fn=(x,out,k0,k1)=>{
    for(let n=0;n<M;n++){const j=rev[n];re[j]=x[2*n];im[j]=x[2*n+1];}
    for(let size=2;size<=M;size<<=1){
      const half=size>>1,step=M/size;
      for(let i=0;i<M;i+=size)for(let j=0;j<half;j++){
        const tr=cs[j*step],ti=-sn[j*step],a=i+j,b=a+half;
        const xr=re[b]*tr-im[b]*ti,xi=re[b]*ti+im[b]*tr;
        re[b]=re[a]-xr;im[b]=im[a]-xi;re[a]+=xr;im[a]+=xi;
      }
    }

// RBJ biquad high-pass (Butterworth, Q=1/√2) as a stateful linear filter — removes DC, handling
// thumps and wind rumble below the bird band before the FFT (Hann sidelobes would leak it upward).
function makeHighpass(fs,f0){
  const w=2*Math.PI*f0/fs,al=Math.sin(w)/(2*Math.SQRT1_2),c=Math.cos(w),a0=1+al;
  const b0=(1+c)/2/a0,b1=-(1+c)/a0,b2=b0,a1=-2*c/a0,a2=(1-al)/a0;
  let x1=0,x2=0,y1=0,y2=0;
  return v=>{const y=b0*v+b1*x1+b2*x2-a1*y1-a2*y2;x2=x1;x1=v;y2=y1;y1=y;return y;};
}

function quantileInPlace(a,q){ // Hoare quickselect on a Float64Array copy
  let lo=0,hi=a.length-1;const k=Math.min(hi,Math.max(0,Math.floor(q*(a.length-1))));
  while(lo<hi){const p=a[(lo+hi)>>1];let i=lo,j=hi;
    while(i<=j){while(a[i]<p)i++;while(a[j]>p)j--;if(i<=j){const t=a[i];a[i]=a[j];a[j]=t;i++;j--;}}
    if(k<=j)hi=j;else if(k>=i)lo=i;else break;}
  return a[k];
}

// Streaming analyzer: push() PCM chunks as they arrive (STFT runs incrementally, so stopping a
// 60 s recording costs only finish()); finish() returns calibrated measurements.
function createAnalyzer(fs,opts={}){
  const N=2**Math.round(Math.log2(DSP.winSec*fs)),hop=N>>2,df=fs/N;
  // One guard bin beyond each band edge so a peak AT the edge can still be interpolated.
  const k0=Math.max(1,Math.floor(DSP.fLo/df)-1),k1=Math.min((N>>1)-1,Math.ceil(Math.min(DSP.fHi,opts.bwHz||Infinity)/df)+1);
  const nb=k1-k0+1,fft=makeRealFFT(N),hp=makeHighpass(fs,DSP.hpHz);
  const win=new Float64Array(N);let w2=0;
  for(let n=0;n<N;n++){win[n]=0.5-0.5*Math.cos(2*Math.PI*n/N);w2+=win[n]*win[n];}
  const norm=2/(N*w2);              // Σ_k P_k = mean signal power (Parseval, one-sided)
  const ring=new Float64Array(N),frame=new Float64Array(N),pw=new Float64Array(nb);
  const trim=Math.round(DSP.trimSec*fs),rows=[];
  let nIn=0,fill=0,sinceHop=0,clip=0;
  function emit(){
    for(let n=0;n<N;n++)frame[n]=ring[(fill+n)%N]*win[n];
    fft(frame,pw,k0,k1);
    const row=new Float32Array(nb);for(let i=0;i<nb;i++)row[i]=pw[i]*norm;
    rows.push(row);
  }
  return{fs,N,hop,df,k0,k1,
    push(chunk){
      for(let i=0;i<chunk.length;i++){
        const v=chunk[i];if(v>=0.99||v<=-0.99)clip++;
        const y=hp(v);nIn++;
        if(nIn<=trim)continue;                       // drop the button-press transient
        ring[fill]=y;fill=(fill+1)%N;sinceHop++;
        if(nIn-trim>=N&&sinceHop>=hop){sinceHop=0;emit();}
      }
    },
    finish(){return analyzeFrames(rows,{fs,N,hop,df,k0,k1,nb,nIn,clip,trim});}
  };
}
function analyzePCM(pcm,fs,opts){const a=createAnalyzer(fs,opts);a.push(pcm);return a.finish();}

function analyzeFrames(rows0,g){
  const {fs,hop,df,k0,nb}=g,fps=fs/hop;
  // Drop the last trimSec too (stop-button transient), if the recording is long enough.
  const dropEnd=Math.round(DSP.trimSec*fps),rows=rows0.length>4*dropEnd+8?rows0.slice(0,rows0.length-dropEnd):rows0;
  const T=rows.length,hz=k=>(k0+k)*df;
  const base={fs,N:g.N,df,frames:T,duration:(g.nIn||0)/fs,clipFrac:g.nIn?g.clip/g.nIn:0,
    peak:0,peaks:[],snrDb:-Infinity,activeFrac:0,silent:true,noteRate:null,windFrac:0};
  if(T<8)return base;

  // 1. Noise PSD, pass 1: per-bin low quantile of 3-frame-smoothed power (robust to intermittent
  //    calls), bias-corrected to the mean, then capped at 4× (6 dB) its ±½-octave running median
  //    across frequency so a continuous singer is not mistaken for stationary noise.
  //    Frames of exact digital silence (a muted or not-yet-started device, padded files) carry no
  //    information about the acoustic noise floor and are excluded; a −116 dBFS-per-band floor
  //    (far below any real microphone's self-noise) keeps SNRs finite.
  const live=[];for(let t=0;t<T;t++){let e=0;for(let k=0;k<nb;k++)e+=rows[t][k];if(e>DSP.deadPow*nb)live.push(t);}
  if(live.length<8)return base;
  let noise=new Float64Array(nb);const col=new Float64Array(live.length);
  for(let k=0;k<nb;k++){
    for(let j=0;j<live.length;j++){const t=live[j],a=rows[Math.max(0,t-1)][k],b=rows[t][k],c=rows[Math.min(T-1,t+1)][k];col[j]=(a+b+c)/3;}
    noise[k]=Math.max(DSP.deadPow,quantileInPlace(col.slice(),DSP.q)/DSP.qBias);
  }
  const capped=new Float64Array(nb);
  for(let k=0;k<nb;k++){
    const f=hz(k),lo=Math.max(0,Math.floor(f/Math.SQRT2/df)-k0),hi=Math.min(nb-1,Math.ceil(f*Math.SQRT2/df)-k0);
    const w=Float64Array.from(noise.subarray(lo,hi+1));capped[k]=Math.min(noise[k],4*quantileInPlace(w,0.5));
  }
  noise=capped;

  // 2. Activity: per-cell SNR smoothed over 3 frames × 3 bins, hysteresis on the frame maximum,
  //    gap bridging and minimum note length. Wind gusts are excluded: strong (>15 dB) energy below
  //    400 Hz that outweighs 400–1600 Hz, with its energy-weighted log-frequency centroid below
  //    280 Hz — the 1/f^α signature of turbulence at the mic. A low owl/dove note sits higher, and
  //    even a pure tone at the band floor is kept because its energy lies within ±2 bins.
  const onR=10**(DSP.onDb/10),offR=10**(DSP.offDb/10),cellR=10**(DSP.cellDb/10);
  const maxGap=Math.round(DSP.maxGapSec*fps),minNote=Math.max(1,Math.round(DSP.minNoteSec*fps));
  const kw=Math.max(1,Math.min(nb-1,Math.round(400/df)-k0)),kw2=Math.min(nb-1,Math.round(1600/df)-k0),lnWind=Math.log(280);
  const lnF=Float64Array.from({length:nb},(_,k)=>Math.log(Math.max(1,(k0+k)*df)));
  const lowE=new Float64Array(T),lowC=new Float64Array(T),lowT=new Uint8Array(T);
  let ssnr,act,wind;

    const snr=rows.map(r=>{const s=new Float32Array(nb);for(let k=0;k<nb;k++)s[k]=r[k]/noise[k];return s;});
    const fmax=new Float64Array(T);ssnr=new Array(T);wind=new Uint8Array(T);act=new Uint8Array(T);
    for(let t=0;t<T;t++){
      const s=new Float32Array(nb),a=snr[Math.max(0,t-1)],b=snr[t],c=snr[Math.min(T-1,t+1)];let m=0;
      for(let k=0;k<nb;k++){const l=Math.max(0,k-1),h=Math.min(nb-1,k+1);

      let s2=0;for(let k=Math.max(0,am-2);k<=Math.min(kw2,am+2);k++)s2+=Math.max(0,rows[t][k]-noise[k]);

  // for stationary noise the 250-bin total fluctuates only ~6 %), then redo detection.
  let quiet=[];for(const t of live){let ok=true;for(let d=-4;d<=4&&ok;d++){const u=Math.min(T-1,Math.max(0,t+d));if(act[u]||wind[u])ok=false;}if(ok)quiet.push(t);}
  if(quiet.length){const tot=quiet.map(t=>rows[t].reduce((a,b)=>a+b,0)),med=quantileInPlace(Float64Array.from(tot),0.5);quiet=quiet.filter((_,i)=>tot[i]<=1.5*med);}
  if(quiet.length>=Math.max(20,0.08*T)){
    const m=new Float64Array(nb);for(const t of quiet)for(let k=0;k<nb;k++)m[k]+=rows[t][k];
    for(let k=0;k<nb;k++)m[k]=Math.max(DSP.deadPow,m[k]/quiet.length);
    noise=m;detect();
  }
  const actIdx=[];for(let t=0;t<T;t++)if(act[t])actIdx.push(t);
  let windN=0;for(let t=0;t<T;t++)windN+=wind[t];

    for(let k=0;k<nb;k++){Pbar[k]+=r[k];if(s[k]>=cellR){const v=Math.max(0,r[k]-noise[k]);sig[k]=v;E[k]+=v;tot+=v;if(v>pv){pv=v;pk=k;}}}
    if(tot<=0)continue;
    fpk.push([Math.log((k0+pk)*df),tot]);

    // peak (c1) and of its three strongest separated peaks (c3). Pure whistle → c1≈1; harmonic
    // stack → c1 moderate, c3 high; broadband buzz/screech → both low.
    let s1=0;for(let k=Math.max(0,pk-C);k<=Math.min(nb-1,pk+C);k++)s1+=sig[k];
    let s3=s1;const used=new Uint8Array(nb);for(let k=Math.max(0,pk-C);k<=Math.min(nb-1,pk+C);k++)used[k]=1;
    for(let j=0;j<2;j++){let bk=-1,bv=0;for(let k=0;k<nb;k++)if(!used[k]&&sig[k]>bv){bv=sig[k];bk=k;}
      if(bk<0)break;for(let k=Math.max(0,bk-C);k<=Math.min(nb-1,bk+C);k++)if(!used[k]){used[k]=1;s3+=sig[k];}}
    c1+=s1;c3+=s3;cw+=tot;

  // 4. In-band SNR: mean active power above the noise floor vs integrated noise power.
  let sp=0,np=0;for(let k=0;k<nb;k++){sp+=Pbar[k]-noise[k];np+=noise[k];}

  //    (Hann: ≤0.016 bin bias → ≲1 Hz at fs/N≈47 Hz).

  for(let k=1;k<nb-1;k++){
    if(!(As[k]>=As[k-1]&&As[k]>As[k+1]&&As[k]>=amax*10**(DSP.peakFloorDb/10)&&Pbar[k]>=2*noise[k]))continue;
    let j=k;if(Pbar[k-1]>Pbar[j])j=k-1;if(Pbar[k+1]>Pbar[j])j=k+1; // true max bin of the unsmoothed spectrum
    if(j<1||j>nb-2)continue;
    const a=Math.log(Pbar[j-1]),b=Math.log(Pbar[j]),c=Math.log(Pbar[j+1]),den=a-2*b+c;

  // Repeated notes / steady whistles ≈ 0.0–0.1; warbles with varied syllables ≳ 0.2.
  if(fpk.length>=5){fpk.sort((a,b)=>a[0]-b[0]);const W=fpk.reduce((s,e)=>s+e[1],0);let c=0,q1=null,q3=null;
    for(const [v,w] of fpk){c+=w;if(q1===null&&c>=0.25*W)q1=v;if(q3===null&&c>=0.75*W){q3=v;break;}}out.pitchIQR=q3-q1;}else out.pitchIQR=null;

// ── Bayesian species scoring ──────────────────────────────────────────────────
// log p(features | species) is a sum of physically motivated terms, all in LOG-FREQUENCY
// (pitch variation between individuals is multiplicative, not additive):
//   peak   — one detected spectral peak is the species' dominant frequency (or its octave),
//   band   — F5/F95 energy quantiles fall inside the species' band,
//   type   — spectral concentration matches the vocal texture (whistle … percussive),
//   rate   — the envelope's note rate falls inside the species' note-rate range.
// Every density is normalised, and each is a mixture with a broad background so a single wrong
// catalogue value degrades a species gracefully instead of vetoing it. An explicit open-set class
// ("not in the catalogue") competes with every species. Rules: .claude/skills/classifier-statistics.
const MODEL={
  sigPeak:0.12,               // σ of ln(f_peak) around ln(fdom): intraspecific + catalogue spread
  cfScale:{h:1,m:1.25,l:1.6}, // catalogue frequency confidence widens σ
  cTrust:{h:0.9,m:0.75,l:0.5},// probability the descriptor (t, nr) is right; else background
  harm:0.02,                  // weight of the octave alternatives (2·fdom, fdom/2)
  outlier:0.05,               // per-term background mixture weight
  tauBand:0.05,sigBand:0.1,   // F5 ∈ [ln fmin−τ, ln fdom], F95 ∈ [ln fdom, ln fmax+τ], Gaussian tails σ
  sigRate:0.15,rateDetect:0.8,rateNullDetect:0.25,
  // Texture prototypes per vocal type: [logit c1, logit c3, σ, ln(pitchIQR+0.02)] where c1/c3 =
  // spectral concentration (±3-bin share around the strongest / 3 strongest peaks) and pitchIQR =
  // spread of the per-frame dominant ln-frequency. Ideal-signal values measured with the DSP
  // (pure tone c≈1.0/1.0; 5-harmonic stack ≈0.68/0.93; 2–6 kHz noise ≈0.15/0.38; repeated notes
  // IQR≲0.08, varied warble ≳0.25), deliberately widened.
  types:{w:[3.0,4.0,1.1,-2.5],t:[2.6,3.6,1.2,-2.4],h:[0.6,2.2,1.1,-2.8],c:[1.2,2.4,1.5,-1.2],n:[-1.4,-0.3,1.1,-1.5],p:[-1.8,-0.7,1.2,-1.3]},
  sigIQR:0.45,
  wideScale:1.75,bgUniform:0.1,
  temp:0.7,                   // likelihood temperature (calibration; NLL-optimal on training seeds)
  pOther:0.12,                // prior mass of "a species not in the catalogue"
  regionIn:0.9,               // prior mass on species listed for the user's region
  bandLn:[Math.log(150),Math.log(12000)],rateLn:[Math.log(0.7),Math.log(40)]

const LN_SQRT_2PI=0.5*Math.log(2*Math.PI);
function logNorm(x,mu,s){const z=(x-mu)/s;return -0.5*z*z-Math.log(s)-LN_SQRT_2PI;}
// Normalised "plateau" density on [a,b] with Gaussian tails of width s (proper: integrates to 1).
function logPlateau(x,a,b,s){const d=x<a?a-x:x>b?x-b:0;return -0.5*(d/s)**2-Math.log((b-a)+Math.sqrt(2*Math.PI)*s);}
const logMix=(la,lb,w)=>{const m=Math.max(la,lb);return m+Math.log((1-w)*Math.exp(la-m)+w*Math.exp(lb-m));};
const logit=p=>{const q=Math.min(0.99,Math.max(0.01,p));return Math.log(q/(1-q));};

// Feature vector derived once per recording from analyzePCM() output.
function featureVector(a){
  const peaks=(a.peaks||[]).slice(0,5),K=peaks.length;
  return{lnPk:peaks.map(p=>Math.log(p.hz)),wPk:peaks.map(p=>0.7*p.share+0.3/Math.max(1,K)),
    lnF5:a.f5?Math.log(a.f5):null,lnF95:a.f95?Math.log(a.f95):null,
    u1:logit(a.conc1||0),u3:logit(a.conc3||0),lnRate:a.noteRate?Math.log(a.noteRate):null,

// Background (log-uniform) log-densities per term.
const BG={peak:-Math.log(MODEL.bandLn[1]-MODEL.bandLn[0]),rate:-Math.log(MODEL.rateLn[1]-MODEL.rateLn[0]),
  type:x=>logNorm(x.u1,1.0,2.4)+logNorm(x.u3,2.0,2.4)+(x.v!==null?logNorm(x.v,-1.9,1.2):0)};

function logLik(x,b,wide=1){

  let lp=-Infinity;
  for(let j=0;j<x.lnPk.length;j++){
    const y=x.lnPk[j];
    const l=logMix(logNorm(y,ld,sig),logMix(logNorm(y,ld+Math.LN2,sig),logNorm(y,ld-Math.LN2,sig),0.5),2*M.harm);
    const m=Math.max(lp,l+Math.log(x.wPk[j]));lp=m+Math.log(Math.exp(lp-m)+Math.exp(l+Math.log(x.wPk[j])-m));
  }
  let L=x.lnPk.length?logMix(lp,BG.peak,out):0;
  // band edges
  if(x.lnF5!==null){
    const sb=M.sigBand*M.cfScale[b.cf||"m"]*wide,lmin=Math.log(b.fmin),lmax=Math.log(b.fmax);
    L+=logMix(logPlateau(x.lnF5,lmin-M.tauBand,ld,sb),BG.peak,out)+logMix(logPlateau(x.lnF95,ld,lmax+M.tauBand,sb),BG.peak,out);
  }
  // descriptors, trusted with probability cTrust[c]
  const tr=M.cTrust[b.c||"m"],T=M.types[b.t];
  if(T&&x.lnPk.length){const st=T[2]*wide;
    L+=logMix(logNorm(x.u1,T[0],st)+logNorm(x.u3,T[1],st)+(x.v!==null?logNorm(x.v,T[3],M.sigIQR*wide):0),BG.type(x),1-tr);}
  let lr;
  if(b.nr){lr=x.lnRate===null?Math.log(1-M.rateDetect)
      :Math.log(M.rateDetect)+logMix(logMix(logPlateau(x.lnRate,Math.log(b.nr[0]),Math.log(b.nr[1]),M.sigRate*wide),
        logMix(logPlateau(x.lnRate-Math.LN2,Math.log(b.nr[0]),Math.log(b.nr[1]),M.sigRate*wide),logPlateau(x.lnRate+Math.LN2,Math.log(b.nr[0]),Math.log(b.nr[1]),M.sigRate*wide),0.5),0.15),BG.rate,out);}
  else lr=x.lnRate===null?Math.log(1-M.rateNullDetect):Math.log(M.rateNullDetect)+BG.rate;
  const lrBg=x.lnRate===null?Math.log(0.5):Math.log(0.5)+BG.rate;
  L+=logMix(lr,lrBg,1-tr);
  return L;
}

// Posterior over the catalogue + open-set class. prior(b) returns an unnormalised prior weight.
function posterior(analysis,pool,prior){
  const x=featureVector(analysis),M=MODEL;
  const L=pool.map(b=>logLik(x,b)),Lw=pool.map(b=>logLik(x,b,M.wideScale));
  // open-set likelihood: an unknown bird looks like "some catalogue bird, more loosely",
  // plus a log-uniform floor
  const mw=Math.max(...Lw);let s=0;for(const l of Lw)s+=Math.exp(l-mw);
  let lu=(x.lnPk.length?BG.peak:0)+(x.lnF5!==null?2*BG.peak:0)+(x.lnPk.length?BG.type(x):0)+(x.lnRate===null?Math.log(0.5):Math.log(0.5)+BG.rate);
  const lOther=logMix(mw+Math.log(s/pool.length),lu,M.bgUniform);
  const pr=pool.map(prior),pz=pr.reduce((a,b)=>a+b,0);
  const lj=pool.map((b,i)=>L[i]/M.temp+Math.log(pr[i]/pz*(1-M.pOther)));lj.push(lOther/M.temp+Math.log(M.pOther));
  const mx=Math.max(...lj),z=lj.reduce((a,l)=>a+Math.exp(l-mx),0);
  const post=lj.map(l=>Math.exp(l-mx)/z);
  return{species:pool.map((b,i)=>({b,p:post[i],ll:L[i]})).sort((a,c)=>c.p-a.p),pOther:post[pool.length],lOther};
}

// ── Regions + spatio-temporal occurrence prior ────────────────────────────────
// Biogeographic realms as lat/lon boxes [realm, lat0, lat1, lon0, lon1]. A point may lie in
// several (Panama, the Levant, the Maghreb, Wallacea); Hawaii maps to none of the catalogue realms.
const REGION_BOXES=[["na",13,84,-170,-50],["na",50,72,-180,-170],["na",7,13,-93,-77],["sa",-56,13,-92,-30],
  ["eu",35,72,-25,45],["eu",27,37.5,-18,35],["eu",30,42,26,45],["af",-35,37.5,-18,52],["af",-27,-10,52,58],
  ["as",0,82,63,180],["as",-9,0,63,131],["as",42,82,45,63],["as",12,42,34,63],["au",-48,-10,112,180],["au",-11,0,131,156]];
const REGION_NAME={na:"N & C America",sa:"South America",eu:"Europe",as:"Asia",af:"Africa",au:"Australasia"};
function getRegions(lat,lon){
  if(lat>=15&&lat<=30&&lon<=-150)return[];
  return[...new Set(REGION_BOXES.filter(([,a,b,c,d])=>lat>=a&&lat<=b&&lon>=c&&lon<=d).map(r=>r[0]))];
}
// Soft region prior: MODEL.regionIn of the prior MASS goes to species listed for the user's
// realm(s), the rest is spread over all others — catalogue range lists are incomplete, and a hard
// filter would veto real visitors.
function regionPrior(regions,pool){
  if(!regions||!regions.length)return()=>1;
  const inR=b=>b.r.some(r=>regions.includes(r)),kin=pool.filter(inR).length,kout=pool.length-kin;
  if(!kin||!kout)return()=>1;
  return b=>inR(b)?MODEL.regionIn/kin:(1-MODEL.regionIn)/kout;
}
// Local, seasonal occurrence (iNaturalist research-grade counts within 50 km, this month ±1)
// replaces the region prior when available: p ∝ (1−ε)·share^γ/Z + ε/K. γ<1 tempers observer
// bias toward conspicuous birds (photo counts ≠ how vocal a species is); ε keeps unrecorded
// species possible. GBIF counts then re-weight only WITHIN the top-5 block (gbifReweight).
const OCC={gamma:0.5,eps:0.1,gbifGamma:0.3,radiusKm:50,ttlMs:7*864e5};
const binom=n=>String(n||"").toLowerCase().split(/\s+/).slice(0,2).join(" ");
function seasonMonths(d=new Date()){const m=d.getMonth()+1;return[(m+10)%12+1,m,m%12+1];}
async function fetchJSON(url,ms=6000){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
  try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw new Error("HTTP "+r.status);return await r.json();}
  finally{clearTimeout(t);}
}
async function fetchOccurrence(lat,lon){
  const months=seasonMonths(),key=`chirping:occ:${lat.toFixed(1)},${lon.toFixed(1)}:${months[1]}`;
  try{const c=JSON.parse(localStorage.getItem(key)||"null");if(c&&Date.now()-c.t<OCC.ttlMs)return c.d;}catch(e){}
  try{
    const d=await fetchJSON(`https://api.inaturalist.org/v1/observations/species_counts?taxon_id=3`
      +`&lat=${lat.toFixed(4)}&lng=${lon.toFixed(4)}&radius=${OCC.radiusKm}&month=${months.join(",")}`
      +`&verifiable=true&captive=false&quality_grade=research&per_page=500`);
    const counts={};let total=0,minC=Infinity;
    for(const r of d.results||[]){const nm=binom(r.taxon?.name);if(!nm.includes(" "))continue;
      counts[nm]=(counts[nm]||0)+(r.count||0);total+=r.count||0;minC=Math.min(minC,r.count||0);}
    // >500 species: an absent species is not "zero records", only "fewer than the rarest listed".
    const truncated=(d.total_results||0)>(d.results||[]).length;
    const occ={src:"iNaturalist",counts,total,nSpecies:Object.keys(counts).length,months,floor:truncated&&isFinite(minC)?minC/2:0};
    try{localStorage.setItem(key,JSON.stringify({t:Date.now(),d:occ}));}catch(e){}
    return occ;
  }catch(e){return null;} // offline, blocked or slow → region prior
}
function occCount(occ,b){
  if(!occ||!(occ.nSpecies>=20))return null;
  for(const n of [b.s,...(b.sy||[])]){const c=occ.counts[binom(n)];if(c)return c;}
  return 0;
}
function makePrior(pool,regions,occ){
  if(!occ||!(occ.nSpecies>=20))return regionPrior(regions,pool);
  const K=pool.length,sh=pool.map(b=>(occCount(occ,b)||occ.floor)/occ.total);
  const z=sh.reduce((s,v)=>s+v**OCC.gamma,0)||1,w=new Map(pool.map((b,i)=>[b,(1-OCC.eps)*sh[i]**OCC.gamma/z+OCC.eps/K]));
  return b=>w.get(b);
}
async function gbifCounts(names,lat,lon){
  const dLat=0.45,dLon=0.45/Math.max(0.2,Math.cos(lat*Math.PI/180)); // ≈ the 50 km iNat radius
  const q=`&decimalLatitude=${(lat-dLat).toFixed(3)},${(lat+dLat).toFixed(3)}&decimalLongitude=${(lon-dLon).toFixed(3)},${(lon+dLon).toFixed(3)}`
    +seasonMonths().map(m=>`&month=${m}`).join("")+"&occurrenceStatus=PRESENT&hasCoordinate=true&hasGeospatialIssue=false&limit=0";
  const base="https://api.gbif.org/v1/occurrence/search?";
  const counts=await Promise.all(names.map(n=>fetchJSON(base+"scientificName="+encodeURIComponent(n)+q).then(d=>d.count??null).catch(()=>null)));
  return{counts};
}
// Partial normalisation: GBIF counts are only known for the top block, so they may only move
// probability between those candidates — the block's total mass, and everything outside it, stay.
function gbifReweight(results,g){
  const mass=results.reduce((s,r)=>s+r.confidence,0);
  const w=results.map((r,i)=>r.confidence*((g.counts[i]??0)+1)**OCC.gbifGamma),ws=w.reduce((a,b)=>a+b,0)||1;
  return results.map((r,i)=>({...r,confidence:w[i]/ws*mass,gbifN:g.counts[i]})).sort((x,y)=>y.confidence-x.confidence);
}

// ── Images: Wikipedia → iNaturalist fallback ──────────────────────────────────
async function getImage(slug,sciName){
  if(slug){
    try{
      const ctrl=new AbortController(),tmo=setTimeout(()=>ctrl.abort(),5000);
      const r=await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(slug)}`,
        {signal:ctrl.signal}).finally(()=>clearTimeout(tmo));
      if(r.ok){const d=await r.json();if(d.thumbnail?.source)return d.thumbnail.source;}
    }catch(e){}
  }
  try{
    const ctrl=new AbortController(),tmo=setTimeout(()=>ctrl.abort(),5000);
    const r=await fetch(`https://api.inaturalist.org/v1/taxa?q=${encodeURIComponent(sciName)}&per_page=1`,
      {signal:ctrl.signal}).finally(()=>clearTimeout(tmo));
    if(r.ok){const d=await r.json();const p=d.results?.[0]?.default_photo?.medium_url;if(p)return p;}
  }catch(e){}
  return"";
}

// ── Xeno-canto reference audio ────────────────────────────────────────────────
async function fetchXenoAudio(sciName){
  try{
    const q=encodeURIComponent(sciName+" type:song quality:A");
    const ctrl=new AbortController(),tmo=setTimeout(()=>ctrl.abort(),5000);
    const r=await fetch(`https://xeno-canto.org/api/2/recordings?query=${q}&page=1`,
                        {signal:ctrl.signal}).finally(()=>clearTimeout(tmo));
    if(!r.ok)return"";
    const d=await r.json();
    return d.recordings?.[0]?.file||"";
  }catch(e){return"";}
}

// ── Main flow ─────────────────────────────────────────────────────────────────
const TYPE_NAME={w:"whistled",h:"harmonic",n:"harsh / buzzy",t:"trilled",c:"varied warble",p:"percussive"};
function khz(f){return(f/1000).toFixed(f<1000?2:1);}
function showFeatures(a){
  $("fPeak").textContent=a.peak?Math.round(a.peak).toLocaleString("en-US")+" Hz":"—";
  $("fBand").textContent=a.f5?`${khz(a.f5)}–${khz(a.f95)} kHz`:"—";
  $("fSnr").textContent=isFinite(a.snrDb)?a.snrDb.toFixed(0)+" dB":"—";
  $("fTone").textContent=a.peak?(a.conc1>=0.85?"tonal":a.conc1>=0.5?"mixed":"noisy")+` ${Math.round(a.conc1*100)}%`:"—";
  $("fRate").textContent=a.noteRate?a.noteRate.toFixed(1)+" /s":"—";
}
async function onStop(){
  if(S._analyzed)return; // guard: stop can be reached from the button, the 60 s limit and iOS interruption
  S._analyzed=true;
  const dur=S.nSamples/(S.fs||1);
  if(!S.analyzer||dur<2){
    statusMsg.textContent="Hold for at least 2 seconds — tap to try again.";
    toast("Hold the button for at least 2 seconds near the bird.");return;
  }
  showLoad("Measuring the recording…");
  await new Promise(r=>setTimeout(r,30)); // let the spinner paint before the final pass
  const a=S.analyzer.finish();S.analyzer=null;S.lastAnalysis=a;
  showFeatures(a);
  if(a.silent||!a.peaks.length){
    hideLoad();statusMsg.textContent="No bird sound detected — try getting closer.";
    toast(`Nothing rose clearly above the background noise${isFinite(a.snrDb)?` (SNR ${a.snrDb.toFixed(0)} dB)`:""}. Get closer, or check mic permissions.`);return;
  }
  if(a.clipFrac>1e-3)toast("Input clipped — the sound was too loud for the mic; move back a little.");
  else if(a.windFrac>0.3)toast("Strong wind noise — shield the microphone for a cleaner measurement.");
  try{
    const regions=S.geoReady?getRegions(S.lat,S.lon):[];
    setStep("Weighing local, seasonal records…");
    const occ=await Promise.race([S.occP||Promise.resolve(null),new Promise(r=>setTimeout(()=>r(null),6500))]);
    const post=posterior(a,BIRD_DB,makePrior(BIRD_DB,regions,occ));
    let results=post.species.slice(0,5).map(e=>({...e.b,confidence:e.p,
      in_region:!regions.length||e.b.r.some(r=>regions.includes(r)),occN:occCount(occ,e.b),gbifN:null}));
    if(S.geoReady){
      setStep("Cross-checking GBIF records nearby…");
      const g=await gbifCounts(results.map(r=>r.s),S.lat,S.lon).catch(()=>null);
      if(g&&g.counts.some(c=>c!==null))results=gbifReweight(results,g);
    }
    setStep("Fetching bird photos and reference audio…");
    await Promise.allSettled(results.slice(0,3).map(async b=>{
      [b.img,b.audioUrl]=await Promise.all([getImage(b.w,b.s),fetchXenoAudio(b.s)]);
    }));
    hideLoad();statusMsg.textContent="Tap to record again";showResults(results,a,post,occ,regions);
  }catch(e){hideLoad();toast("Error: "+e.message);statusMsg.textContent="Tap to try again.";console.error(e);}
}

// ── Results ───────────────────────────────────────────────────────────────────
function showResults(results,a,post,occ,regions){
  cardsEl.innerHTML="";
  if(!results.length){cardsEl.innerHTML=`<p style="color:var(--muted);padding:.5rem">No match — try in a quieter spot closer to the bird.</p>`;resultsEl.classList.add("show");return;}
  const top=results.slice(0,3),shown=top.reduce((s,r)=>s+r.confidence,0);
  $("resTitle").textContent=top[0].confidence<0.25?"Uncertain — closest matches":"Top 3 Matches";
  const loc=S.geoReady?`${Math.abs(S.lat).toFixed(1)}°${S.lat>=0?"N":"S"} ${Math.abs(S.lon).toFixed(1)}°${S.lon>=0?"E":"W"}`:"global";
  const prior=occ&&occ.nSpecies>=20?`prior: ${occ.src} ≤${OCC.radiusKm} km, ${occ.months.map(m=>MONTHS[m-1]).join("–")}`
    :regions.length?`prior: ${regions.map(r=>REGION_NAME[r]).join(" / ")}`:"prior: none";
  resMeta.textContent=`${a.duration.toFixed(1)} s · peak ${Math.round(a.peak)} Hz · ${khz(a.f5)}–${khz(a.f95)} kHz · SNR ${a.snrDb.toFixed(0)} dB · ${loc} · ${prior}`;
  top.forEach((b,i)=>cardsEl.appendChild(makeCard(b,i+1)));
  // Where the rest of the probability is: honest bookkeeping instead of renormalising to 100 %.
  const alike=results.slice(3).filter(r=>r.confidence>=0.5*top[top.length-1].confidence).map(r=>r.n);
  const note=document.createElement("p");note.className="res-note";
  note.textContent=`Other catalogue species: ${Math.round(Math.max(0,1-shown-post.pOther)*100)}% · `
    +`possibly a species not in this ${BIRD_DB.length}-species catalogue: ${Math.round(post.pOther*100)}%`
    +(alike.length?` · also consistent: ${alike.join(", ")}`:"");
  cardsEl.appendChild(note);
  resultsEl.classList.add("show");
  setTimeout(()=>{
    document.querySelectorAll(".conf-fill").forEach((el,i)=>{
      setTimeout(()=>{el.style.width=Math.min(100,(top[i]?.confidence||0)*100).toFixed(1)+"%";},60);
    });
  },50);
}
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function makeCard(b,rank){
  const conf=Math.min(1,b.confidence||0),pct=conf<0.01?"<1":String(Math.round(conf*100));
  const cls=conf>=.50?"hi":conf>=.20?"md":"lo";
  let bc,bt;
  if(b.occN>0||b.gbifN>0){bc="rgn-ok";bt="✓ "+[b.occN>0?`${b.occN} iNat`:"",b.gbifN>0?`${b.gbifN} GBIF`:""].filter(Boolean).join(" + ")+" records nearby this season";}
  else if(b.occN===0){bc="rgn-no";bt="⚠ No nearby records this season";}
  else if(b.in_region){bc="rgn-typ";bt="Listed for your region";}
  else{bc="rgn-no";bt="⚠ Not usually in your region";}
  const xeno=`https://xeno-canto.org/explore?query=${encodeURIComponent(b.s)}`;
  const fb=`data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'%3E%3Crect width='80' height='80' fill='%230d1525'/%3E%3Ctext y='52' x='40' text-anchor='middle' font-size='36'%3E%F0%9F%90%A6%3C/text%3E%3C/svg%3E`;
  const art=document.createElement("article");
  art.className="bcard";art.setAttribute("role","listitem");
  art.setAttribute("tabindex","0");art.setAttribute("aria-label",`Rank ${rank}: ${b.n}, ${pct}% probability`);
  art.innerHTML=`
    <div class="bcard-rank rank-${rank}" aria-hidden="true">${rank}</div>
    <div class="bcard-inner">
      <img class="bcard-img" src="${esc(b.img||fb)}" alt="${esc(b.n)}" loading="lazy" onerror="this.src='${fb}'">
      <div class="bcard-body">
        <div class="bcard-common">${esc(b.n)}</div>
        <div class="bcard-sci">${esc(b.s)}</div>
        <div class="conf-row"><span>Probability</span><span class="conf-pct">${pct}%</span></div>
        <div class="conf-bar" role="progressbar" aria-valuenow="${Math.round(conf*100)}" aria-valuemin="0" aria-valuemax="100">
          <div class="conf-fill ${cls}"></div>
        </div>
        <span class="rgn-badge ${bc}">${esc(bt)}</span>
        <div class="freq-tag">&#x1F3B5; ${b.fmin}–${b.fmax} Hz (peak ${b.fdom} Hz) · ${TYPE_NAME[b.t]||""}${b.nr?` · ${b.nr[0]}–${b.nr[1]} notes/s`:""}</div>
      </div>
    </div>
    <div class="bcard-detail">
      ${b.h?`<p><strong>Habitat:</strong> ${esc(b.h)}</p>`:""}
      ${b.f?`<p><strong>Fun fact:</strong> ${esc(b.f)}</p>`:""}
      ${b.audioUrl
        ?`<div class="audio-row"><span class="audio-label">🎵 Reference call (xeno-canto)</span><audio controls preload="none" src="${esc(b.audioUrl)}" style="width:100%;height:32px;margin-top:.3rem" onclick="event.stopPropagation()"></audio></div>`
        :`<a href="${xeno}" target="_blank" rel="noopener" class="xeno-link" onclick="event.stopPropagation()">&#x1F50A; Reference recordings on xeno-canto</a>`}
    </div>`;
  const toggle=()=>{const d=art.querySelector(".bcard-detail");const o=d.classList.toggle("open");art.setAttribute("aria-expanded",o);};
  art.addEventListener("click",toggle);
  art.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle();}});
  return art;
}
$("closeBtn").addEventListener("click",()=>resultsEl.classList.remove("show"));

// ── Helpers ───────────────────────────────────────────────────────────────────
function showLoad(msg){loadEl.classList.add("show");if(msg)loadStep.textContent=msg;}
function setStep(msg){loadStep.textContent=msg;}
function hideLoad(){loadEl.classList.remove("show");}
let _tt=null;
function toast(msg,dur=4500){toastEl.textContent=msg;toastEl.classList.add("show");clearTimeout(_tt);_tt=setTimeout(()=>toastEl.classList.remove("show"),dur);}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");}
</script>
</body>
